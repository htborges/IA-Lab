# IA-Lab website (GitHub Pages)
# Content lives in the repo folders. The CI workflow copies it into website/docs before building.
site_name: IA-Lab
site_description: Hands-on AI Red Teaming lab — attacking and defending ML models and LLM applications
site_url: https://htborges.github.io/IA-Lab/
repo_url: https://github.com/htborges/IA-Lab
repo_name: htborges/IA-Lab
edit_uri: ""
docs_dir: docs
copyright: Content under CC BY 4.0 · Code under MIT · For educational and authorized testing only

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português (BR)
          build: true
          site_description: Laboratório prático de AI Red Teaming — atacando e defendendo modelos de ML e aplicações com LLM
          nav_translations:
            Home: Início
            Fundamentals: Fundamentos
            Track map: Mapa da trilha
            Concepts: Conceitos
            01 · What is AI: 01 · O que é IA
            02 · History of AI: 02 · História da IA
            03 · How machines learn: 03 · Como as máquinas aprendem
            04 · Essential math: 04 · Matemática essencial
            Classic ML: ML clássico
            05 · Linear and logistic regression: 05 · Regressão linear e logística
            06 · Trees, Naive Bayes and SVM: 06 · Árvores, Naive Bayes e SVM
            07 · Unsupervised learning: 07 · Aprendizado não supervisionado
            08 · Reinforcement learning: 08 · Aprendizado por reforço
            09 · Neural networks: 09 · Redes neurais
            10 · CNN and RNN: 10 · CNN e RNN
            Generative AI: IA generativa
            11 · LLMs and Transformers: 11 · LLMs e Transformers
            12 · Diffusion models: 12 · Modelos de difusão
            13 · RAG, agents and MCP: 13 · RAG, agents e MCP
            Attacks: Ataques
            Overview: Visão geral
            Direct Prompt Injection: Prompt Injection Direta
            Indirect Prompt Injection: Prompt Injection Indireta
            System Prompt Leakage: Vazamento de System Prompt
            LLM Output Attacks: Ataques via Saída
            XSS via LLM Output: XSS via saída do LLM
            Downstream Injection: Injeção em sistemas downstream
            Data & Supply Chain: Dados e Supply Chain
            Model Backdoors: Backdoors em modelos
            Malicious Model Files: Arquivos de modelo maliciosos
            Application & System: Aplicação e Sistema
            Evasion: Evasão
            Privacy: Privacidade
            Defense: Defesa
            Tools: Ferramentas
            Methodology: Metodologia
            About: Sobre
            Security Policy: Política de Segurança

nav:
  - Home: index.md
  - Fundamentals:
      - 00-fundamentals/index.md
      - Track map: 00-fundamentals/map.md
      - Concepts:
          - 01 · What is AI: 00-fundamentals/01-what-is-ai.md
          - 02 · History of AI: 00-fundamentals/02-history-of-ai.md
          - 03 · How machines learn: 00-fundamentals/03-how-machines-learn.md
          - 04 · Essential math: 00-fundamentals/04-essential-math.md
      - Classic ML:
          - 05 · Linear and logistic regression: 00-fundamentals/05-linear-logistic-regression.md
          - 06 · Trees, Naive Bayes and SVM: 00-fundamentals/06-trees-naive-bayes-svm.md
          - 07 · Unsupervised learning: 00-fundamentals/07-unsupervised-learning.md
          - 08 · Reinforcement learning: 00-fundamentals/08-reinforcement-learning.md
      - Deep Learning:
          - 09 · Neural networks: 00-fundamentals/09-neural-networks.md
          - 10 · CNN and RNN: 00-fundamentals/10-cnn-rnn.md
      - Generative AI:
          - 11 · LLMs and Transformers: 00-fundamentals/11-llms.md
          - 12 · Diffusion models: 00-fundamentals/12-diffusion-models.md
          - 13 · RAG, agents and MCP: 00-fundamentals/13-ai-systems.md
      - Frameworks: 01-frameworks/index.md
  - Attacks:
      - Prompt Injection:
          - 02-prompt-injection/index.md
          - Direct Prompt Injection: 02-prompt-injection/direct-prompt-injection.md
          - Indirect Prompt Injection: 02-prompt-injection/indirect-prompt-injection.md
          - System Prompt Leakage: 02-prompt-injection/system-prompt-leakage.md
          - Jailbreaks: 02-prompt-injection/jailbreaks.md
      - LLM Output Attacks:
          - 03-output-attacks/index.md
          - XSS via LLM Output: 03-output-attacks/xss-via-llm-output.md
          - Downstream Injection: 03-output-attacks/downstream-injection.md
      - Data & Supply Chain:
          - 04-data-attacks/index.md
          - Data Poisoning: 04-data-attacks/data-poisoning.md
          - Model Backdoors: 04-data-attacks/model-backdoors.md
          - Malicious Model Files: 04-data-attacks/malicious-model-files.md
      - Application & System: 05-app-and-system/index.md
      - Evasion: 06-evasion/index.md
      - Privacy: 07-privacy/index.md
  - Defense: 08-defense/index.md
  - Labs:
      - labs/index.md
      - vuln-chatbot-rag: labs/vuln-chatbot-rag/index.md
  - Tools: tools/index.md
  - Methodology: methodology/index.md
  - Cheatsheets: cheatsheets/index.md
  - Writeups: writeups/index.md
  - About:
      - Disclaimer: DISCLAIMER.md
      - Security Policy: SECURITY.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/htborges/IA-Lab
