<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Cloud Support · IA-Lab</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#e6e6e6; --muted:#8a8f98; --accent:#4fd1a5; --user:#2a3a55; --bot:#22262f; --warn:#e5534b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; background:var(--panel); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; flex:1; }
  header .tag { color:var(--warn); font-size:12px; }
  select, input, button { font:inherit; padding:8px; border-radius:6px; border:1px solid #333; background:#0f1115; color:var(--text); }
  button { background:var(--accent); color:#0f1115; border:none; cursor:pointer; font-weight:600; }
  #chat { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:10px; min-height:calc(100vh - 170px); }
  .msg { padding:10px 14px; border-radius:10px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--user); align-self:flex-end; }
  .bot { background:var(--bot); align-self:flex-start; }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  form { max-width:820px; margin:0 auto; padding:16px; display:flex; gap:8px; }
  form input { flex:1; }
  #flag { display:flex; gap:8px; }
</style>
</head>
<body>
<header>
  <h1>☁️ Acme Cloud Support <span class="tag">· intentionally vulnerable lab</span></h1>
  <label>Level
    <select id="level">
      <option value="1">1 · no defense</option>
      <option value="2">2 · defensive prompt</option>
      <option value="3">3 · + input filter</option>
      <option value="4">4 · + output filter</option>
    </select>
  </label>
  <div id="flag"><input id="flagInput" placeholder="IALAB{...}"><button id="flagBtn" type="button">Check</button></div>
</header>

<div id="chat"></div>

<form id="form">
  <input id="input" autocomplete="off" placeholder="Ask Aria something..." required>
  <button>Send</button>
</form>

<script>
  const chat = document.getElementById('chat');
  const levelSel = document.getElementById('level');
  let history = [];

  levelSel.onchange = () => { history = []; chat.innerHTML = ''; };

  function add(role, html, meta) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    // VULNERABLE BY DESIGN (LLM05 Improper Output Handling):
    // model output is inserted as raw HTML. Used in section 03.
    div.innerHTML = html + (meta ? `<div class="meta">${meta}</div>` : '');
    chat.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
  }

  document.getElementById('form').onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('input');
    const message = input.value; input.value = '';
    const userDiv = document.createElement('div');
    userDiv.className = 'msg user'; userDiv.textContent = message; chat.appendChild(userDiv);
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, level: +levelSel.value, history }) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || r.status);
      add('bot', data.answer, data.sources.length ? 'sources: ' + data.sources.join(', ') : '');
      if (!data.blocked) history.push({ role: 'user', content: message }, { role: 'assistant', content: data.answer });
    } catch (err) { add('bot', '⚠️ ' + err.message); }
  };

  document.getElementById('flagBtn').onclick = async () => {
    const flag = document.getElementById('flagInput').value;
    const r = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ flag }) });
    alert((await r.json()).correct ? '✅ Correct!' : '❌ Wrong flag');
  };
</script>
</body>
</html>
